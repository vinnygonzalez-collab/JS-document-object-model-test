<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript Lab</title>
        <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="quiz-container">
        <!-- Question Block -->
            <p class="eyebrow">JavaScript Lab</p>
            <h1 id="question">In JavaScript, what is a string?</h1>
            <p id="progress" class="progress"></p>
        
        <!-- Answer Options Block -->
        <div id="answer-buttons" class="btn-grid">
        </div>
        
        <!-- Navigation Controls -->
            <p id="feedback" class="feedback" role="status" aria-live="polite"></p>
            <div class="quiz-footer">
                <p id="score" class="score">Score: 0</p>
                <button id="next-btn" class="next-btn" type="button" hidden>Next Question</button>
            </div>
    </div>

    <!-- Connecting JavaScript to HTML -->
    <script src="script.js"></script>

</body>
</html>
